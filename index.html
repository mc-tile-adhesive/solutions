<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro-Level Adhesive Finder</title>
    <link rel="stylesheet" href="./Css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="glass-container">
        <div class="progress-container">
            <div class="progress-bar" id="progress"></div>
        </div>

        <div id="wizard-form">
            <section class="step active" id="step-1">
                <h1>Step 1: Tile Dimensions</h1>
                <div class="input-group">
                    <label>Width (cm)</label>
                    <input type="number" id="tile-width" placeholder="e.g. 60">
                </div>
                <div class="input-group">
                    <label>Length (cm)</label>
                    <input type="number" id="tile-length" placeholder="e.g. 60">
                </div>
                <div class="input-group">
                    <label>Thickness (cm)</label>
                    <select id="tile-thickness">
                        <option value="0.5">0.5 cm</option>
                        <option value="0.6-1">0.6 - 1.0 cm</option>
                    </select>
                </div>
                <div class="btn-group">
                    <button class="btn next" onclick="nextStep(2)">Next Step</button>
                </div>
            </section>

            <section class="step" id="step-2">
                <h1>Step 2: Material</h1>
                <div class="input-group">
                    <label>What is the tile made of?</label>
                    <select id="tile-type">
                        <option value="Local Ceramic">Local Ceramic</option>
                        <option value="Imported ceramic">Imported Ceramic</option>
                        <option value="Local porcelain">Local Porcelain</option>
                        <option value="Imported porcelain">Imported Porcelain</option>
                    </select>
                </div>
                <div class="btn-group">
                    <button class="btn back" onclick="nextStep(1)">Back</button>
                    <button class="btn next" onclick="nextStep(3)">Next</button>
                </div>
            </section>

            <section class="step" id="step-3">
                <h1>Step 3: Appearance</h1>
                <div class="input-group">
                    <label>Preferred Color Tone</label>
                    <select id="tile-color">
                        <option value="Ceramic Near white">Near White</option>
                        <option value="Ceramic Near black">Near Black</option>
                        <option value="Porcelain Near white">Porcelain White</option>
                        <option value="Porcelain Near black">Porcelain Black</option>
                    </select>
                </div>
                <div class="btn-group">
                    <button class="btn back" onclick="nextStep(2)">Back</button>
                    <button class="btn next" onclick="nextStep(4)">Next</button>
                </div>
            </section>

            <section class="step" id="step-4">
                <h1>Step 4: Environment</h1>
                <div class="input-group">
                    <label>Exposure to Water</label>
                    <select id="exposure">
                        <option value="Dry room">Dry Room</option>
                        <option value="Wet room">Wet Room</option>
                        <option value="Swimming pool">Swimming Pool</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Installation Area</label>
                    <select id="direction">
                        <option value="Vertical In House">Wall (Indoor)</option>
                        <option value="Vertical Outside">Wall (Outdoor)</option>
                        <option value="Horizontal In House">Floor (Indoor)</option>
                        <option value="Horizontal Outside">Floor (Outdoor)</option>
                    </select>
                </div>
                <div class="btn-group">
                    <button class="btn back" onclick="nextStep(3)">Back</button>
                    <button class="btn finish" onclick="calculateResult()">Find Adhesive</button>
                </div>
            </section>

            <section class="step" id="results">
                <h1>Recommended Adhesive</h1>
                <div id="match-container">
                    </div>
                <button class="btn back" onclick="location.reload()">Start Over</button>
            </section>
        </div>
    </div>

    <script src="./JavaScript/data.js"></script>
    <script src="./JavaScript/script.js"></script>
</body>
</html>
